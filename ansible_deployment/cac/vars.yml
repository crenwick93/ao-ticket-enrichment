---
# =============================================================================
# AAP Configuration as Code — Ticket Enrichment with Automation Orchestrator
# =============================================================================

# -----------------------------------------------------------------------------
# Custom Credential Types
# -----------------------------------------------------------------------------
controller_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for ITSM API"
    kind: cloud
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

  - name: "AO Webhook Credential"
    description: "OAuth2 service account for Automation Orchestrator EDA trigger"
    kind: cloud
    inputs:
      fields:
        - id: webhook_base_url
          type: string
          label: "AO Base URL"
        - id: webhook_client_id
          type: string
          label: "Service Account Client ID"
        - id: webhook_client_secret
          type: string
          label: "Service Account Client Secret"
          secret: true
    injectors:
      extra_vars:
        webhook_base_url: !unsafe "{{ webhook_base_url }}"
        webhook_client_id: !unsafe "{{ webhook_client_id }}"
        webhook_client_secret: !unsafe "{{ webhook_client_secret }}"

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
controller_credentials:
  - name: "ServiceNow ITSM"
    description: "ServiceNow developer instance for incident management"
    organization: "Default"
    credential_type: "ServiceNow Credential"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

  - name: "AAP Controller"
    description: "Controller credential for internal workflow operations"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "AO Webhook"
    description: "OAuth2 credentials for AO EDA trigger endpoint"
    organization: "Default"
    credential_type: "AO Webhook Credential"
    inputs:
      webhook_base_url: "{{ ao_webhook_base_url }}"
      webhook_client_id: "{{ ao_webhook_client_id }}"
      webhook_client_secret: "{{ ao_webhook_client_secret }}"

  - name: "Monitoring SSH"
    description: "SSH key for EC2 monitoring host (generated by Terraform)"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: ec2-user
      ssh_key_data: "{{ monitoring_ssh_key }}"

# -----------------------------------------------------------------------------
# Projects
# -----------------------------------------------------------------------------
controller_projects:
  - name: "AO Ticket Enrichment Demo"
    description: "Playbooks and rulebooks for AO-based ticket enrichment"
    organization: "Default"
    scm_type: "git"
    scm_url: "https://github.com/crenwick93/ao-ticket-enrichment.git"
    scm_branch: "main"
    scm_update_on_launch: true

# -----------------------------------------------------------------------------
# Job Templates
# -----------------------------------------------------------------------------
controller_templates:
  - name: "AO Ticket Enrichment Bridge"
    description: >-
      EDA-to-AO bridge: obtains OAuth2 token from Automation Orchestrator
      and POSTs the incident event payload to the AO EDA trigger endpoint.
    organization: "Default"
    job_type: "run"
    project: "AO Ticket Enrichment Demo"
    playbook: "playbooks/trigger_ao_workflow.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "AO Webhook"

  - name: "Gather Diagnostics"
    description: >-
      SSH to the affected host and collect nginx status, config test,
      journal logs, failed units, and system health (disk, memory, uptime).
    organization: "Default"
    job_type: "run"
    project: "AO Ticket Enrichment Demo"
    playbook: "playbooks/gather_diagnostics.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "Monitoring SSH"

  - name: "Update SNOW Ticket"
    description: >-
      Updates a ServiceNow incident with work notes and optional state change.
      Called at each workflow milestone.
    organization: "Default"
    job_type: "run"
    project: "AO Ticket Enrichment Demo"
    playbook: "playbooks/update_snow_ticket.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow ITSM"

  - name: "Rollback nginx Configuration"
    description: >-
      Rolls back a broken nginx configuration on the target host. Removes
      invalid or unknown directives from /etc/nginx/nginx.conf, validates the
      configuration with nginx -t, and restarts the nginx service. Use this
      job template when nginx has failed to start due to a bad configuration
      change, syntax error, or unknown directive in the config file. Requires
      target_host_ip (or incident_description containing the host IP) and
      optionally incident_sys_id. Returns a remediation_report artifact with
      before/after config test results and service status.
    organization: "Default"
    job_type: "run"
    project: "AO Ticket Enrichment Demo"
    playbook: "playbooks/rollback_nginx_config.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    credentials:
      - "Monitoring SSH"

# =============================================================================
# Event-Driven Ansible
# =============================================================================

# -----------------------------------------------------------------------------
# EDA Credential Types
# -----------------------------------------------------------------------------
eda_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for EDA source plugins"
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

# -----------------------------------------------------------------------------
# EDA Decision Environments
# -----------------------------------------------------------------------------
eda_decision_environments:
  - name: "snow-de"
    description: "Decision environment with servicenow.itsm for incident polling"
    organization: "Default"
    image_url: "{{ de_image }}"

# -----------------------------------------------------------------------------
# EDA Projects
# -----------------------------------------------------------------------------
eda_projects:
  - name: "AO Ticket Enrichment Demo"
    description: "EDA rulebooks for ServiceNow incident monitoring"
    organization: "Default"
    url: "https://github.com/crenwick93/ao-ticket-enrichment.git"
    wait: true

# -----------------------------------------------------------------------------
# EDA Credentials
# -----------------------------------------------------------------------------
eda_credentials:
  - name: "AAP Controller Token"
    description: "Controller credential so EDA can launch job templates"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Default"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: false

  - name: "ServiceNow EDA"
    description: "ServiceNow credentials for the EDA records source plugin"
    credential_type: "ServiceNow Credential"
    organization: "Default"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

# -----------------------------------------------------------------------------
# Rulebook Activations
# -----------------------------------------------------------------------------
eda_rulebook_activations:
  - name: "snow-incidents"
    description: "Monitor ServiceNow incidents and trigger AO workflow"
    organization: "Default"
    project: "AO Ticket Enrichment Demo"
    rulebook: "listen_snow_incidents.yml"
    decision_environment: "snow-de"
    enabled: true
    extra_vars:
      webhook_path: "{{ ao_webhook_path }}"
    eda_credentials:
      - "AAP Controller Token"
      - "ServiceNow EDA"
