---
# Play 1: Resolve the target host IP and add it to inventory
- name: Register target host for diagnostics
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Extract host IP from incident description (if target_host_ip not provided)
      ansible.builtin.set_fact:
        _target_ip: "{{ target_host_ip | default(incident_description | default('') | regex_search('Affected host IP:\\s*(\\S+)', '\\1') | default([''], true) | first) }}"

    - name: Fail if no target host IP found
      ansible.builtin.assert:
        that: _target_ip | length > 0
        fail_msg: "Could not determine target host IP. Provide target_host_ip or ensure incident description contains 'Affected host IP: <ip>'"

    - name: Add target host to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ _target_ip }}"
        groups: target_hosts
        ansible_user: ec2-user
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

# Play 2: Run diagnostics against the dynamically-added host
- name: Gather system diagnostics from affected host
  hosts: target_hosts
  become: true
  gather_facts: true

  vars:
    service_name: "nginx.service"

  tasks:

    - name: Extract service name from incident description (if present)
      ansible.builtin.set_fact:
        service_name: "{{ incident_description | default('') | regex_search('(\\S+\\.service)', '\\1') | default([service_name], true) | first }}"

    - name: List all failed systemd units
      ansible.builtin.command: systemctl list-units --state=failed --no-pager --no-legend
      register: failed_units
      changed_when: false
      failed_when: false

    - name: Get status of the target service
      ansible.builtin.command: "systemctl status {{ service_name }} --no-pager"
      register: service_status
      changed_when: false
      failed_when: false

    - name: Check if service is enabled
      ansible.builtin.command: "systemctl is-enabled {{ service_name }}"
      register: service_enabled
      changed_when: false
      failed_when: false

    - name: Pull last 50 lines of journal for the target service
      ansible.builtin.command: "journalctl -u {{ service_name }} -n 50 --no-pager"
      register: service_journal
      changed_when: false
      failed_when: false

    - name: Check nginx configuration syntax
      ansible.builtin.command: "nginx -t"
      register: nginx_config_test
      changed_when: false
      failed_when: false

    - name: Get system uptime
      ansible.builtin.command: uptime
      register: sys_uptime
      changed_when: false

    - name: Get disk usage
      ansible.builtin.command: df -h /
      register: sys_disk
      changed_when: false

    - name: Get memory usage
      ansible.builtin.command: free -h
      register: sys_memory
      changed_when: false

    - name: Read nginx config file
      ansible.builtin.command: cat /etc/nginx/nginx.conf
      register: nginx_conf_content
      changed_when: false
      failed_when: false

    - name: Build diagnostics report
      ansible.builtin.set_fact:
        diagnostics_report: |
          === DIAGNOSTICS REPORT ===
          Host: {{ inventory_hostname }} ({{ ansible_default_ipv4.address | default('unknown') }})
          Timestamp: {{ ansible_date_time.iso8601 }}

          --- Target Service: {{ service_name }} ---
          Enabled: {{ service_enabled.stdout | default('unknown') }}
          Status:
          {{ service_status.stdout | default('unable to retrieve status') }}

          --- nginx -t (config test) ---
          {{ nginx_config_test.stderr | default(nginx_config_test.stdout | default('unable to run nginx -t')) }}

          --- Journal Logs (last 50 lines) ---
          {{ service_journal.stdout | default('no journal entries found') }}

          --- All Failed Units ---
          {{ failed_units.stdout | default('none') | default('no failed units', true) }}

          --- nginx.conf contents ---
          {{ nginx_conf_content.stdout | default('unable to read nginx.conf') }}

          --- System Health ---
          Uptime: {{ sys_uptime.stdout }}
          Disk:
          {{ sys_disk.stdout }}
          Memory:
          {{ sys_memory.stdout }}

    - name: Display diagnostics report
      ansible.builtin.debug:
        var: diagnostics_report

    - name: Publish diagnostics report via set_stats
      ansible.builtin.set_stats:
        data:
          diagnostics_report: "{{ diagnostics_report }}"
          incident_sys_id: "{{ incident_sys_id }}"
          incident_description: "{{ incident_description }}"
