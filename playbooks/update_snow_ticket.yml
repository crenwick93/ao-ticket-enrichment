---
- name: Update ServiceNow Incident
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - incident_sys_id is defined
          - incident_sys_id | length > 0
        fail_msg: "incident_sys_id must be provided"

    - name: Add work notes before resolving
      servicenow.itsm.incident:
        sys_id: "{{ incident_sys_id }}"
        other:
          work_notes: "[code]{{ work_notes }}[/code]"
      when:
        - work_notes | default('') | length > 0
        - incident_state | default('') | string in ['6', 'resolved']

    - name: Resolve incident
      servicenow.itsm.incident:
        sys_id: "{{ incident_sys_id }}"
        other:
          state: "6"
          close_code: "Solved (Permanently)"
          close_notes: "{{ close_notes | default('Resolved by automated remediation') }}"
      when:
        - incident_state | default('') | string in ['6', 'resolved']

    - name: Update incident with work notes and state change
      servicenow.itsm.incident:
        sys_id: "{{ incident_sys_id }}"
        state: "{{ incident_state }}"
        other:
          work_notes: "[code]{{ work_notes }}[/code]"
      when:
        - work_notes | default('') | length > 0
        - incident_state | default('') | length > 0
        - incident_state | default('') | string not in ['6', 'resolved']

    - name: Update incident with work notes only
      servicenow.itsm.incident:
        sys_id: "{{ incident_sys_id }}"
        other:
          work_notes: "[code]{{ work_notes }}[/code]"
      when:
        - work_notes | default('') | length > 0
        - incident_state | default('') | length == 0

    - name: Update incident state only
      servicenow.itsm.incident:
        sys_id: "{{ incident_sys_id }}"
        state: "{{ incident_state }}"
      when:
        - work_notes | default('') | length == 0
        - incident_state | default('') | length > 0

    - name: Display update confirmation
      ansible.builtin.debug:
        msg: "Incident {{ incident_sys_id }} updated (state={{ incident_state | default('unchanged') }})"
