---
- name: Monitor incidents in ServiceNow
  hosts: all
  execution_strategy: parallel
  sources:
    - servicenow.itsm.records:
        table: incident
        interval: 10
        remote_servicenow_timezone: "Europe/London"
        # newest first to avoid the "oldest page first" trap
        sysparm_query: >
          ORDERBYDESCsys_updated_on^ORDERBYDESCsys_id
      filters:
        - ansible.eda.json_filter:
        - ansible.eda.normalize_keys:
  rules:

    - name: Trigger AO workflow for new incidents
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - sys_id
      condition: event.short_description is defined
      action:
        run_job_template:
          name: AO Ticket Enrichment Bridge
          organization: Default
          post_events: true
          job_args:
            extra_vars:
              webhook_path: "{{ webhook_path }}"
              incident_description: "{{ event.short_description + ' ' + event.description }}"
              incident_sys_id: "{{ event.sys_id }}"
              incident_number: "{{ event.number }}"
              event_payload:
                incident_number: "{{ event.number }}"
                incident_sys_id: "{{ event.sys_id }}"
                incident_description: "{{ event.short_description + ' ' + event.description }}"
                incident_urgency: "{{ event.urgency }}"
                incident_impact: "{{ event.impact }}"
